name: Create Prerelease

on:
  workflow_run:
    workflows: ["Validate Claude Plugins"]
    types:
      - completed
    branches: ["main"]

permissions:
  contents: write
  pull-requests: read

jobs:
  prerelease:
    name: Create Prerelease
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get next version
        id: version
        run: |
          # Get the latest release tag (if any)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Extract version components
          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3 | cut -d- -f1)

          # For prereleases, increment patch and add -pre suffix
          PATCH=$((PATCH + 1))
          PRERELEASE_VERSION="v${MAJOR}.${MINOR}.${PATCH}-pre"

          echo "prerelease_version=$PRERELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "Prerelease version: $PRERELEASE_VERSION"

      - name: Delete existing prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete any existing prerelease with the same tag
          gh release delete "${{ steps.version.outputs.prerelease_version }}" --yes 2>/dev/null || echo "No existing release to delete"
          git push --delete origin "${{ steps.version.outputs.prerelease_version }}" 2>/dev/null || echo "No existing tag to delete"

      - name: Update marketplace.json version
        run: |
          # Update version in marketplace.json
          VERSION="${{ steps.version.outputs.prerelease_version }}"
          VERSION_NO_V="${VERSION#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION_NO_V\"/" .claude-plugin/marketplace.json

      - name: Commit version updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.prerelease_version }}" || echo "No changes to commit"
          git push || echo "No changes to push"

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.prerelease_version }}" \
            --title "Prerelease ${{ steps.version.outputs.prerelease_version }}" \
            --notes "Automatic prerelease from main branch" \
            --prerelease \
            --target main
